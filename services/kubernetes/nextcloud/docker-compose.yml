services:
  nextcloud-postgres:
    image: postgres:17
    container_name: nextcloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nextcloud
    volumes:
      - /mnt/tank/nextcloud/database:/var/lib/postgresql/data
    ports:
      - "5433:5432"
