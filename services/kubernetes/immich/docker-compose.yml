services:
  immich-postgres:
    # Verify this tag against https://immich.app/docs/install/docker-compose
    # for the exact version pinned to your Immich release (v2.6.3).
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: password
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /mnt/tank/immich/database:/var/lib/postgresql/data
    shm_size: "128mb"
    ports:
      # Exposes Postgres to your LAN so the k8s cluster can reach it.
      # Consider binding to a specific interface (e.g. "192.168.1.X:5432:5432")
      # instead of all interfaces if this host is reachable beyond your trusted network.
      - "5432:5432"
