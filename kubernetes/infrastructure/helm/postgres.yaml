apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-postgres
  namespace: immich
spec:
  interval: 10m

  chart:
    spec:
      chart: postgresql
      version: "15.5.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:
    auth:
      username: immich
      password: immichpassword
      database: immich

    primary:
      persistence:
        enabled: true
        size: 10Gi
