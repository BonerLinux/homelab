apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich

spec:
  interval: 30m

  chart:
    spec:
      chart: immich
      sourceRef:
        kind: OCIRepository
        name: immich
        namespace: flux-system

  values:
    image:
      tag: v2.7.5

    redis:
      enabled: true

    server:
      service:
        type: NodePort
        nodePort: 32283

    immich:
      persistence:
        library:
          existingClaim: immich-library
